[project]
name = "point-cloud-central"
version = "0.1.0"
description = "Reproducible point-cloud processing notebooks and command-line experiments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipywidgets>=8.1.8",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "open3d>=0.19.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "tqdm>=4.69.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["B018"]
